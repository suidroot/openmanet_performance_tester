org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP doesn't yet support AGP 9's built-in-Kotlin / new DSL; use the classic Kotlin Gradle plugin
# + KSP until KSP adds support (https://kotl.in/gradle/agp-built-in-kotlin). Both flags are
# required together - either alone still routes through the new (KSP-incompatible) path.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
